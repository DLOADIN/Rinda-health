# Optional local stack: PostgreSQL 16 and the API, as an alternative to Neon for development.
# Synthetic data only (C-08). Start with: docker compose up -d   Then: npm run dev -w @rinda/web
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rinda
      POSTGRES_PASSWORD: rinda
      POSTGRES_DB: rinda
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rinda']
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://rinda:rinda@db:5432/rinda
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
